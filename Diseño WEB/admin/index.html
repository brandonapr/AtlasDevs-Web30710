<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - EDValleDigital</title>
  <link rel="stylesheet" href="/css/menu.css">
</head>
<body data-private-page="admin">
  <header class="simple-header">
    <a href="/menu/" class="back-link">Menú público</a>
    <img src="/img/logo-brand.png" alt="Ensaladas del Valle">
    <h1>Administración de menú</h1>
  </header>

  <main class="private-shell">
    <section class="private-panel">
      <span class="eyebrow">Gestión separada</span>
      <h2>Productos</h2>
      <form class="private-form admin-form">
        <label>Nombre del producto<input type="text" placeholder="Bolon de queso"></label>
        <label>Categoría<input type="text" placeholder="Bolones"></label>
        <label>Precio<input type="number" step="0.01" placeholder="2.50"></label>
        <label>Imagen<input type="text" placeholder="/img/platos/04-bolon-de-queso.jpg"></label>
        <label>Descripción<textarea placeholder="Descripción corta para el comensal"></textarea></label>
        <button type="button" class="secondary-action">Guardar producto</button>
      </form>
    </section>
    <section class="private-panel">
      <h2>Inventario visual</h2>
      <div id="adminProducts"></div>
    </section>
  </main>

  <script type="module" src="/js/private.js"></script>
</body>
</html>
