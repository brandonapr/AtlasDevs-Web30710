<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - EDValleDigital</title>
  <link rel="stylesheet" href="/css/menu.css">
</head>
<body data-private-page="login">
  <header class="simple-header">
    <a href="/menu/" class="back-link">Volver al menú público</a>
    <img src="/img/logo-brand.png" alt="Ensaladas del Valle">
    <h1>Ingreso del equipo</h1>
  </header>

  <main class="private-shell">
    <section class="private-card">
      <span class="eyebrow">Área privada</span>
      <h2>Iniciar sesión</h2>
      <form class="private-form" id="loginForm">
        <label>
          Usuario
          <input type="text" id="usuarioInput" autocomplete="username" placeholder="Jhoana">
        </label>
        <label>
          Contraseña
          <input type="password" id="passwordInput" autocomplete="current-password" placeholder="johana123">
        </label>
        <button class="secondary-action" type="submit">Ingresar</button>
        <p class="status-message" id="loginStatus">Usa el usuario asignado para cada actor interno.</p>
      </form>
    </section>
  </main>

  <script type="module" src="/js/private.js"></script>
</body>
</html>
